name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/skill-cli
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r benchmarks/requirements.txt
      - run: go build -o bin/skill-cli${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/skill-cli
      - run: go build -o bin/mcp-peer${{ runner.os == 'Windows' && '.exe' || '' }} ./benchmarks/cmd/mcp-peer
      - run: go build -o bin/demo-server${{ runner.os == 'Windows' && '.exe' || '' }} ./examples/demo-server
      - run: python -m unittest discover -s benchmarks -p "test_*.py" -v
      - run: python scripts/smoke.py
      - if: runner.os == 'Linux'
        run: go test -race ./...
